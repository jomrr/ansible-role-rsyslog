---
# role: rsyslog
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Run the local syslog service and optionally forward journal records
      and selected text files.
    options:
      rsyslog_backup:
        type: bool
        default: true
        description:
          - Back up managed files before changing their contents, including the Red Hat
            journal input configuration.
      rsyslog_server:
        type: str
        description:
          - A receiver hostname or IP address enables forwarding. Omit the variable or supply
            an empty string for local operation.
      rsyslog_forward_only:
        type: bool
        default: false
        description:
          - When forwarding is enabled, stop all messages in the default ruleset before
            the distribution's local logging rules.
          - The forwarding queue still buffers records when the receiver is offline.
      rsyslog_imjournal_ratelimit_interval:
        type: int
        default: 600
        description:
          - Rate-limit window in seconds for the rsyslog journal input. Set to 0 to disable
            its rate limit.
      rsyslog_imjournal_ratelimit_burst:
        type: int
        default: 20000
        description:
          - Maximum number of journal records accepted per window. Ignored when the interval
            is 0.
      rsyslog_transport:
        type: str
        choices:
          - tls
          - tcp
        default: tls
        description:
          - Send octet-counted RFC 5424 messages over authenticated TLS or plain TCP.
      rsyslog_port:
        type: int
        description:
          - Override the destination port. The default is 6514 for TLS and 514 for plain
            TCP.
      rsyslog_ca_file:
        type: path
        default: ''
        description:
          - Absolute path to a readable PEM trust bundle on the sender. An empty value uses
            the platform trust bundle.
      rsyslog_client_cert_file:
        type: path
        default: ''
        description:
          - Absolute path to the sender's PEM certificate chain for mutual TLS. Set together
            with rsyslog_client_key_file.
      rsyslog_client_key_file:
        type: path
        default: ''
        description:
          - Absolute path to the matching PEM private key on the sender.
      rsyslog_permitted_peers:
        type: list
        elements: str
        description:
          - Accepted receiver certificate identities. Defaults to a list containing rsyslog_server
            when forwarding is enabled.
      rsyslog_min_severity:
        type: str
        choices:
          - emerg
          - alert
          - crit
          - err
          - warning
          - notice
          - info
          - debug
        default: info
        description:
          - Least urgent severity forwarded. For example, warning includes emerg through
            warning.
      rsyslog_queue_max_disk_space:
        type: str
        default: 256m
        description:
          - Disk budget for the forwarding queue. Supply a positive byte count or an rsyslog
            size such as 256m.
      rsyslog_platform_files:
        type: list
        elements: path
        default: []
        description:
          - Absolute paths or glob patterns for active platform logs, such as /var/log/dpkg.log.
      rsyslog_additional_files:
        type: list
        elements: raw
        default: []
        description:
          - Each entry is an absolute path or glob pattern, or a mapping with a required
            path and optional tag and facility. All matches share the configured tag and
            facility. The defaults are the basename of the configured path or pattern and
            local0. The first mapping for a path takes precedence over plain path entries.
