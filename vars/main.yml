---
# role: rsyslog
# file: vars/main.yml

__rsyslog_required_facts: [os_family, distribution]
__rsyslog_required_facts_subsets: ['!all', '!min', distribution]
__rsyslog_validate_service: /usr/sbin/rsyslogd -N1
__rsyslog_validate_config: /usr/local/sbin/rsyslog-validate-snippet %s
__rsyslog_validate_timezone_table: /usr/bin/python3 -m json.tool %s /dev/null
__rsyslog_forwarding: "{{ rsyslog_server is defined and rsyslog_server not in [none, ''] }}"
__rsyslog_custom_interval: "{{ rsyslog_imjournal_ratelimit_interval | int != 600 }}"
__rsyslog_custom_burst: "{{ rsyslog_imjournal_ratelimit_burst | int != 20000 }}"
__rsyslog_journal_dropin: "{{ ansible_facts.os_family == 'RedHat' and (__rsyslog_custom_interval or __rsyslog_custom_burst) }}"
# A mapping takes precedence over a plain path listed in either inventory variable.
__rsyslog_file_inputs: >-
  {{ (rsyslog_additional_files | select('mapping') | list)
     + ((rsyslog_platform_files + (rsyslog_additional_files | reject('mapping') | list))
        | map('community.general.dict_kv', 'path') | list) }}
__rsyslog_timestamp_inputs: "{{ __rsyslog_file_inputs | unique(attribute='path', case_sensitive=true) | selectattr('timestamp', 'defined') | list }}"
__rsyslog_timestamp_zones: >-
  {{ __rsyslog_timestamp_inputs | map(attribute='timestamp') | selectattr('timezone', 'defined')
     | map(attribute='timezone') | reject('match', '^(UTC$|[+-])') | unique(case_sensitive=true) | list }}
# Group one selects the timestamp from each standard text layout.
__rsyslog_timestamp_locations:
  access: '\[([^]]+)\]'
  apache_error: '^\[([^]]+)\]'
  nginx_error: '^([^ ]+ [^ ]+)'
  sssd: '^[ *]*\(([^)]+)\)'
  iso8601: '^([^ ]+)'
