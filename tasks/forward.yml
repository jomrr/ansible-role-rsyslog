---
# role: rsyslog
# file: tasks/forward.yml

- name: forward | Grant the Ubuntu syslog account access to the journal
  become: true
  become_user: root
  ansible.builtin.user:
    name: syslog
    groups: systemd-journal
    append: true
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart rsyslog

- name: forward | Create the private directory for input positions and queued messages
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __rsyslog_state_directory }}"
    state: directory
    owner: "{{ __rsyslog_state_owner }}"
    group: "{{ __rsyslog_state_owner }}"
    mode: '0700'

- name: forward | Permit the Ubuntu AppArmor profile to read sender inputs
  become: true
  become_user: root
  ansible.builtin.template:
    src: apparmor-central.j2
    dest: /etc/apparmor.d/rsyslog.d/central-forwarding
    owner: root
    group: root
    mode: '0644'
    backup: "{{ rsyslog_backup }}"
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart rsyslog

- name: forward | Install the civil-time lookup table for named time zones
  become: true
  become_user: root
  ansible.builtin.template:
    src: timezones.json.j2
    dest: /etc/rsyslog.d/central-timezones.json
    owner: root
    group: root
    mode: '0644'
    backup: "{{ rsyslog_backup }}"
    validate: "{{ __rsyslog_validate_timezone_table }}"
  when: __rsyslog_timestamp_zones | length > 0
  notify: restart rsyslog

- name: forward | Configure forwarding
  become: true
  become_user: root
  ansible.builtin.template:
    src: central.conf.j2
    dest: /etc/rsyslog.d/01-central.conf
    owner: root
    group: root
    mode: '0644'
    backup: "{{ rsyslog_backup }}"
    validate: "{{ __rsyslog_validate_config }}"
  notify: restart rsyslog
