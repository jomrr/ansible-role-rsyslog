---
# role: rsyslog
# file: tasks/assert.yml

- name: assert | Check journal input rate limits
  ansible.builtin.assert:
    that:
      - 0 <= rsyslog_imjournal_ratelimit_interval | int <= 2147483647
      - 0 <= rsyslog_imjournal_ratelimit_burst | int <= 2147483647
    fail_msg: Supply nonnegative 32-bit integers for the journal rate-limit interval and burst.
    quiet: true

- name: assert | Check forwarding settings
  when: __rsyslog_forwarding
  block:
    - name: assert | Check the forwarding destination and queue size
      ansible.builtin.assert:
        that:
          - rsyslog_server is match('^[A-Za-z0-9:][A-Za-z0-9.:-]*\Z')
          - rsyslog_port | int >= 1
          - rsyslog_port | int <= 65535
          - rsyslog_queue_max_disk_space is match('^[1-9][0-9]*[kKmMgGtT]?\Z')
        fail_msg: Supply a receiver address, a port from 1 to 65535 and a positive queue size such as 256m.
        quiet: true

    - name: assert | Check TCP keepalive settings
      ansible.builtin.assert:
        that:
          - 0 <= rsyslog_keepalive_time | int <= 32767
          - 0 <= rsyslog_keepalive_interval | int <= 32767
          - 0 <= rsyslog_keepalive_probes | int <= 127
        fail_msg: Supply keepalive times from 0 to 32767 seconds and a probe count from 0 to 127. Zero uses the corresponding kernel default.
        quiet: true
      when: rsyslog_keepalive | bool

    - name: assert | Check the TLS identity and certificate paths
      ansible.builtin.assert:
        that:
          - rsyslog_permitted_peers | length > 0
          - rsyslog_permitted_peers | reject('match', '^(\*\.)?[A-Za-z0-9:][A-Za-z0-9.:-]*\Z') | list | length == 0
          - (rsyslog_client_cert_file == '') == (rsyslog_client_key_file == '')
          - >-
            [rsyslog_ca_file, rsyslog_client_cert_file, rsyslog_client_key_file]
            | reject('equalto', '') | reject('match', '^/[-A-Za-z0-9_./+]+\Z') | list | length == 0
        fail_msg: Supply permitted certificate names and absolute PEM paths. Mutual TLS requires both the client certificate and its key.
        quiet: true
      when: rsyslog_transport == 'tls'

    - name: assert | Check text log paths, tags and facilities
      ansible.builtin.assert:
        that:
          - __rsyslog_input.keys() | difference(['path', 'tag', 'facility', 'timestamp']) | length == 0
          - __rsyslog_input.path is defined and __rsyslog_input.path is string
          - __rsyslog_input.path is match('^(?:/(?:[-A-Za-z0-9_.+*?]|\[[!^]?[-A-Za-z0-9_.+]+\])+)+\Z')
          - __rsyslog_input.tag is undefined or (__rsyslog_input.tag is string and __rsyslog_input.tag is match('^[-A-Za-z0-9_.+]+:?\Z'))
          - >-
            __rsyslog_input.facility is undefined or __rsyslog_input.facility in
            ['kern', 'user', 'mail', 'daemon', 'auth', 'syslog', 'lpr', 'news', 'uucp', 'cron', 'authpriv', 'ftp',
             'local0', 'local1', 'local2', 'local3', 'local4', 'local5', 'local6', 'local7']
        fail_msg: Supply an absolute text log path or glob and, optionally, a syslog tag and facility.
        quiet: true
      loop: "{{ __rsyslog_file_inputs }}"
      loop_control:
        loop_var: __rsyslog_input
        label: "{{ __rsyslog_input.path | default('missing path') }}"

    - name: assert | Check event timestamp formats, locations and time zones
      ansible.builtin.assert:
        that:
          - __rsyslog_input.timestamp is mapping
          - __rsyslog_input.timestamp.keys() | difference(['format', 'regex', 'field', 'timezone']) | length == 0
          - __rsyslog_input.timestamp.format | default('') in __rsyslog_timestamp_locations
          - __rsyslog_input.timestamp.regex is undefined or __rsyslog_input.timestamp.field is undefined
          - >-
            __rsyslog_input.timestamp.regex is undefined or (__rsyslog_input.timestamp.regex is string
            and __rsyslog_input.timestamp.regex is match('^[^\x00-\x1f\x7f]+\Z'))
          - >-
            __rsyslog_input.timestamp.field is undefined or (__rsyslog_input.timestamp.field is string
            and __rsyslog_input.timestamp.field is match('^[-@.A-Za-z0-9_]+\Z'))
          - >-
            __rsyslog_input.timestamp.timezone is undefined or (__rsyslog_input.timestamp.timezone is string
            and __rsyslog_input.timestamp.timezone is match('^([+-]([01][0-9]|2[0-3]):[0-5][0-9]|[A-Za-z][-+A-Za-z0-9_]*(/[A-Za-z][-+A-Za-z0-9_]*)*)\Z'))
        fail_msg: Supply a timestamp format, an optional capture regex or JSON field, and an IANA zone or signed HH:MM offset.
        quiet: true
      loop: "{{ __rsyslog_timestamp_inputs }}"
      loop_control:
        loop_var: __rsyslog_input
        label: "{{ __rsyslog_input.path }}"
