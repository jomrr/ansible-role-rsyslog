---
# role: rsyslog
# file: tasks/main.yml

- name: RSYSLOG | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __rsyslog_platform_files) }}"
  when: __rsyslog_forwarding
  vars:
    __rsyslog_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: RSYSLOG | Validate forwarding inputs
  ansible.builtin.import_tasks: assert.yml
  when: __rsyslog_forwarding

- name: RSYSLOG | Install rsyslog and the selected transport
  become: true
  become_user: root
  ansible.builtin.package:
    name: >-
      {{ ['rsyslog', __rsyslog_tls_package, 'ca-certificates']
         if __rsyslog_forwarding and rsyslog_transport == 'tls' else ['rsyslog'] }}
    state: present

- name: RSYSLOG | Configure the remote sender
  ansible.builtin.include_tasks: forward.yml
  when: __rsyslog_forwarding

- name: RSYSLOG | Remove managed forwarding configuration in local mode
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __rsyslog_sender_file }}"
    state: absent
  loop:
    - /etc/rsyslog.d/01-central.conf
    - /usr/local/sbin/rsyslog-validate-snippet
    - /etc/apparmor.d/rsyslog.d/central-forwarding
  loop_control:
    loop_var: __rsyslog_sender_file
  when: not __rsyslog_forwarding
  notify: restart rsyslog

- name: RSYSLOG | Enable and start rsyslog
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: rsyslog.service
    enabled: true
    state: started
