---
# role: rsyslog
# file: molecule/resources/playbooks/side_effect.yml

- name: Enable forwarding without play-level facts
  hosts: all
  gather_facts: false
  vars:
    rsyslog_server: rsyslog-collector.test
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Read the active forwarding service invocation
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started
      check_mode: true
      register: __rsyslog_before_reapply

- name: Reapply and verify default TLS forwarding
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: rsyslog-collector.test
  tasks:
    - name: Preview the current forwarding settings
      ansible.builtin.import_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      check_mode: true

    - name: Reapply the current forwarding settings
      ansible.builtin.import_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Read the forwarding service invocation after reapplication
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started
      check_mode: true
      register: __rsyslog_after_reapply

    - name: Verify unchanged settings kept the sender running
      ansible.builtin.assert:
        that:
          - __rsyslog_after_reapply.status.ActiveState == 'active'
          - __rsyslog_after_reapply.status.InvocationID == __rsyslog_before_reapply.status.InvocationID
        quiet: true

    - name: Write a debug record to the journal
      ansible.builtin.command: systemd-cat -p debug -t molecule-journal /bin/echo filtered-debug-probe
      register: __rsyslog_debug_probe
      changed_when: __rsyslog_debug_probe.rc == 0
      failed_when: __rsyslog_debug_probe.rc != 0

    - name: Append a file record to the active DNF log
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: "dd status=none oflag=append conv=nocreat,notrunc of=/var/log/{{ 'dnf5' if ansible_facts.pkg_mgr == 'dnf5' else 'dnf' }}.log"
        stdin: excluded-dnf-probe
      when: ansible_facts.os_family == 'RedHat'
      register: __rsyslog_dnf_probe
      changed_when: __rsyslog_dnf_probe.rc == 0
      failed_when: __rsyslog_dnf_probe.rc != 0

    - name: Write an info record from Loki with the default empty exclusion list
      ansible.builtin.command: systemd-cat -p info -t loki /bin/echo central-journal-probe
      register: __rsyslog_info_probe
      changed_when: __rsyslog_info_probe.rc == 0
      failed_when: __rsyslog_info_probe.rc != 0

    - name: Wait for the journal record at the default TLS port
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tls
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ loki \d+ - - central-journal-probe$'
        timeout: 45

    - name: Verify the default forwarding connection has no keepalive timer
      ansible.builtin.command: ss -Hnto state established dport = :6514
      register: __rsyslog_default_socket
      changed_when: false
      failed_when: __rsyslog_default_socket.rc != 0 or __rsyslog_default_socket.stdout == '' or 'timer:(keepalive,' in __rsyslog_default_socket.stdout

    - name: Send the control record to the distribution's local socket input
      ansible.builtin.command:
        cmd: socat -u STDIN UNIX-SENDTO:/run/systemd/journal/syslog
        stdin: '<14>loki: central-journal-probe'
      register: __rsyslog_socket_control
      changed_when: __rsyslog_socket_control.rc == 0
      failed_when: __rsyslog_socket_control.rc != 0
      when: ansible_facts.os_family != 'RedHat'

    - name: Verify local file logging with default forwarding
      become: true
      become_user: root
      ansible.builtin.wait_for:
        path: "{{ '/var/log/syslog' if ansible_facts.os_family == 'Debian' else '/var/log/messages' }}"
        search_regex: 'loki(?:\[\d+\])?: central-journal-probe'
        timeout: 45

    - name: Check that debug and DNF records were excluded
      ansible.builtin.command:
        argv:
          - grep
          - -Ec
          - '^[0-9]+ <[0-9]+>1 [^ ]+ [^ ]+ (molecule-journal|dnf5?\.log) [^ ]+ - - (filtered-debug-probe|excluded-dnf-probe)$'
          - /var/log/molecule-collector-tls
      register: __rsyslog_excluded
      changed_when: false
      failed_when: __rsyslog_excluded.rc != 1

- name: Verify a finite journal input rate limit
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: "{{ '' if ansible_facts.os_family == 'RedHat' else 'rsyslog-collector.test' }}"
    rsyslog_imjournal_ratelimit_interval: 300
    rsyslog_imjournal_ratelimit_burst: 2
    __rsyslog_stats_log: "{{ '/var/log/syslog' if ansible_facts.os_family == 'Debian' else '/var/log/messages' }}"
  pre_tasks:
    - name: Enable journal input statistics for the rate-limit test
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/99-molecule-journal-stats.conf
        mode: '0644'
        content: |
          module(load="impstats" interval="1" log.syslog="off" log.file="{{ __rsyslog_stats_log }}")
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Write more journal records than the burst allows
      ansible.builtin.command: systemd-cat -t molecule-limited seq 1 12
      register: __rsyslog_limited_probe
      changed_when: __rsyslog_limited_probe.rc == 0
      failed_when: __rsyslog_limited_probe.rc != 0

    - name: Wait for imjournal to report two accepted records and subsequent drops
      become: true
      become_user: root
      ansible.builtin.wait_for:
        path: "{{ __rsyslog_stats_log }}"
        search_regex: 'imjournal: origin=imjournal .*submitted=2\b.*discarded=[1-9][0-9]*'
        timeout: 45

    - name: Remove the test statistics configuration
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/rsyslog.d/99-molecule-journal-stats.conf
        state: absent

- name: Verify mutual TLS and an independent certificate identity
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: 127.0.0.1
    rsyslog_port: 16514
    rsyslog_keepalive: true
    rsyslog_keepalive_time: 60
    rsyslog_keepalive_interval: 15
    rsyslog_keepalive_probes: 4
    rsyslog_permitted_peers: [standby.example.org, localhost]
    rsyslog_client_cert_file: /run/rsyslog-client.crt
    rsyslog_client_key_file: /run/rsyslog-client.key
    rsyslog_min_severity: warning
    rsyslog_queue_max_disk_space: 64m
    rsyslog_imjournal_ratelimit_interval: 0
    rsyslog_imjournal_ratelimit_burst: 2
  pre_tasks:
    - name: Create the client identity trusted by the mutual TLS collector
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=molecule-sender
          -addext extendedKeyUsage=clientAuth -keyout /run/rsyslog-client.key -out /run/rsyslog-client.crt
        creates: /run/rsyslog-client.key
      register: __rsyslog_client_cert
      changed_when: __rsyslog_client_cert.start is not none
      failed_when: __rsyslog_client_cert.rc != 0

    - name: Grant the Ubuntu service account read access to the client key
      become: true
      become_user: root
      ansible.builtin.file:
        path: /run/rsyslog-client.key
        group: syslog
        mode: '0640'
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Start a collector requiring the trusted client certificate
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-mtls.service
        state: started
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Write records either side of the severity threshold
      ansible.builtin.command:
        cmd: "systemd-cat -p {{ __rsyslog_priority }} -t molecule-mtls /bin/cat"
        stdin: |-
          probe-{{ __rsyslog_priority }}-1
          probe-{{ __rsyslog_priority }}-2
          probe-{{ __rsyslog_priority }}-3
      register: __rsyslog_priority_probe
      changed_when: __rsyslog_priority_probe.rc == 0
      failed_when: __rsyslog_priority_probe.rc != 0
      loop: [notice, warning]
      loop_control:
        loop_var: __rsyslog_priority
        label: "{{ __rsyslog_priority }}"

    - name: Wait for every warning beyond the disabled burst limit on the authenticated connection
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-mtls
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ molecule-mtls \d+ - - probe-warning-{{ __rsyslog_sequence }}$'
        timeout: 45
      loop: [1, 2, 3]
      loop_control:
        loop_var: __rsyslog_sequence
        label: "{{ __rsyslog_sequence }}"

    - name: Verify the authenticated sender socket has an active TCP keepalive timer
      ansible.builtin.command: ss -Hnto state established dport = :16514
      register: __rsyslog_tls_socket
      changed_when: false
      failed_when: __rsyslog_tls_socket.rc != 0
      until: "'timer:(keepalive,' in __rsyslog_tls_socket.stdout"
      retries: 10
      delay: 1

    - name: Check that the less urgent notice stayed local
      ansible.builtin.command:
        argv: [grep, -Ec, '^[0-9]+ <[0-9]+>1 [^ ]+ [^ ]+ molecule-mtls [0-9]+ - - probe-notice-[123]$', /var/log/molecule-collector-mtls]
      register: __rsyslog_notice
      changed_when: false
      failed_when: __rsyslog_notice.rc != 1

- name: Buffer journal and file inputs on a pure TCP forwarder
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: 127.0.0.1
    rsyslog_transport: tcp
    rsyslog_keepalive: true
    rsyslog_forward_only: true
    rsyslog_excluded_programs: [loki, excluded.log]
    rsyslog_platform_files: [/var/log/molecule-platform.log]
    rsyslog_additional_files:
      - /var/log/molecule-extra.log
      - /var/log/excluded.log
      - path: /var/log/sssd/*.log
        tag: sssd
        facility: local3
      - path: '/var/log/ss?d/worker[!a-z].out'
        tag: worker
  pre_tasks:
    - name: Create the log directory for the file patterns
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/log/sssd
        state: directory
        mode: '0755'

    - name: Take the TCP collector offline
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-tcp.service
        state: stopped
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Verify restoring both defaults removed the journal rate-limit drop-in
      ansible.builtin.wait_for:
        path: /etc/rsyslog.d/00-imjournal.conf
        state: absent
        timeout: 3

    - name: Verify the forwarding configuration defers to the journal input defaults
      ansible.builtin.command:
        argv: [grep, -Ei, 'ratelimit\.(interval|burst)', /etc/rsyslog.d/01-central.conf]
      register: __rsyslog_default_limits
      changed_when: false
      failed_when: __rsyslog_default_limits.rc != 1

    - name: Write journal records from Loki and a similarly named program while the collector is offline
      ansible.builtin.command: systemd-cat -p info -t {{ __rsyslog_program }} /bin/echo offline-journal-{{ __rsyslog_program }}-probe
      register: __rsyslog_offline_journal
      changed_when: __rsyslog_offline_journal.rc == 0
      failed_when: __rsyslog_offline_journal.rc != 0
      loop: [loki, loki-canary]
      loop_control:
        loop_var: __rsyslog_program
        label: "{{ __rsyslog_program }}"

    - name: Send a separate record directly to the distribution's syslog socket
      ansible.builtin.command:
        cmd: socat -u STDIN UNIX-SENDTO:/run/systemd/journal/syslog
        stdin: '<14>molecule-socket: offline-socket-probe'
      register: __rsyslog_offline_socket
      changed_when: __rsyslog_offline_socket.rc == 0
      failed_when: __rsyslog_offline_socket.rc != 0
      when: ansible_facts.os_family != 'RedHat'

    - name: Create selected text inputs after the daemon has restarted
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/var/log/{{ __rsyslog_source }}"
        content: "probe-{{ __rsyslog_source }}\n"
        mode: '0644'
      loop: [molecule-platform.log, molecule-extra.log, excluded.log, sssd/domain-one.log, sssd/pam.log, sssd/worker1.out, sssd/workera.out]
      loop_control:
        loop_var: __rsyslog_source
        label: "{{ __rsyslog_source }}"

    - name: Stop the sender while the TCP collector is offline
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: stopped

    - name: Remove a consumed input so only the saved queue can deliver its record
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/log/molecule-extra.log
        state: absent

    - name: Bring the TCP collector back online
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-tcp.service
        state: started

    - name: Start the sender with its saved queue
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started

    - name: Wait for the buffered journal record at the TCP collector
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tcp
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ loki-canary \d+ - - offline-journal-loki-canary-probe$'
        timeout: 45

    - name: Verify the reconnected plain TCP socket has an active keepalive timer
      ansible.builtin.command: ss -Hnto state established dport = :514
      register: __rsyslog_tcp_socket
      changed_when: false
      failed_when: __rsyslog_tcp_socket.rc != 0
      until: "'timer:(keepalive,' in __rsyslog_tcp_socket.stdout"
      retries: 10
      delay: 1

    - name: Verify the excluded Loki record is still in the local journal
      become: true
      become_user: root
      ansible.builtin.command: journalctl -b -t loki -o cat --grep=^offline-journal-loki-probe$ --lines=1
      register: __rsyslog_local_loki
      changed_when: false
      failed_when: __rsyslog_local_loki.rc != 0 or __rsyslog_local_loki.stdout != 'offline-journal-loki-probe'

    - name: Verify the journal and socket probes bypassed the distribution's local file
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '(loki(-canary)?|molecule-socket)(\[[0-9]+\])?: offline-(journal-loki(-canary)?|socket)-probe'
          - "{{ '/var/log/syslog' if ansible_facts.os_family == 'Debian' else '/var/log/messages' }}"
      register: __rsyslog_local_probes
      changed_when: false
      failed_when: __rsyslog_local_probes.rc != 1

    - name: Verify octet-counted TCP records with default and custom file metadata
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tcp
        search_regex: >-
          (?m)^[0-9]+ <{{ __rsyslog_probe.pri }}>1 \S+ \S+ {{ __rsyslog_probe.tag }} - - -
          probe-{{ __rsyslog_probe.source | regex_escape }}$
        timeout: 45
      loop:
        - { source: molecule-platform.log, tag: 'molecule-platform\.log', pri: 134 }
        - { source: molecule-extra.log, tag: 'molecule-extra\.log', pri: 134 }
        - { source: sssd/domain-one.log, tag: sssd, pri: 158 }
        - { source: sssd/pam.log, tag: sssd, pri: 158 }
        - { source: sssd/worker1.out, tag: worker, pri: 134 }
      loop_control:
        loop_var: __rsyslog_probe
        label: "{{ __rsyslog_probe.source }}"

    - name: Verify the collector received neither excluded program nor the nonmatching file
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ' - - (offline-journal-loki-probe|probe-excluded\.log|probe-sssd/workera\.out)$'
          - /var/log/molecule-collector-tcp
      register: __rsyslog_excluded_records
      changed_when: false
      failed_when: __rsyslog_excluded_records.rc != 1
