---
# role: rsyslog
# file: molecule/resources/playbooks/side_effect.yml

- name: Enable forwarding without play-level facts
  hosts: all
  gather_facts: false
  vars:
    rsyslog_server: rsyslog-collector.test
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Read the active forwarding service invocation
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started
      check_mode: true
      register: __rsyslog_before_reapply

- name: Reapply and verify default TLS forwarding
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: rsyslog-collector.test
  tasks:
    - name: Preview the current forwarding settings
      ansible.builtin.import_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      check_mode: true

    - name: Reapply the current forwarding settings
      ansible.builtin.import_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Read the forwarding service invocation after reapplication
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started
      check_mode: true
      register: __rsyslog_after_reapply

    - name: Verify unchanged settings kept the sender running
      ansible.builtin.assert:
        that:
          - __rsyslog_after_reapply.status.ActiveState == 'active'
          - __rsyslog_after_reapply.status.InvocationID == __rsyslog_before_reapply.status.InvocationID
        quiet: true

    - name: Write a debug record to the journal
      ansible.builtin.command: systemd-cat -p debug -t molecule-journal /bin/echo filtered-debug-probe
      register: __rsyslog_debug_probe
      changed_when: __rsyslog_debug_probe.rc == 0
      failed_when: __rsyslog_debug_probe.rc != 0

    - name: Append a file record to the active DNF log
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: "dd status=none oflag=append conv=nocreat,notrunc of=/var/log/{{ 'dnf5' if ansible_facts.pkg_mgr == 'dnf5' else 'dnf' }}.log"
        stdin: excluded-dnf-probe
      when: ansible_facts.os_family == 'RedHat'
      register: __rsyslog_dnf_probe
      changed_when: __rsyslog_dnf_probe.rc == 0
      failed_when: __rsyslog_dnf_probe.rc != 0

    - name: Write an info record to the journal
      ansible.builtin.command: systemd-cat -p info -t molecule-journal /bin/echo central-journal-probe
      register: __rsyslog_info_probe
      changed_when: __rsyslog_info_probe.rc == 0
      failed_when: __rsyslog_info_probe.rc != 0

    - name: Wait for the journal record at the default TLS port
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tls
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ molecule-journal \d+ - - central-journal-probe$'
        timeout: 45

    - name: Send the control record to the distribution's local socket input
      ansible.builtin.command:
        cmd: socat -u STDIN UNIX-SENDTO:/run/systemd/journal/syslog
        stdin: '<14>molecule-journal: central-journal-probe'
      register: __rsyslog_socket_control
      changed_when: __rsyslog_socket_control.rc == 0
      failed_when: __rsyslog_socket_control.rc != 0
      when: ansible_facts.os_family != 'RedHat'

    - name: Verify local file logging with default forwarding
      become: true
      become_user: root
      ansible.builtin.wait_for:
        path: "{{ '/var/log/syslog' if ansible_facts.os_family == 'Debian' else '/var/log/messages' }}"
        search_regex: 'molecule-journal(?:\[\d+\])?: central-journal-probe'
        timeout: 45

    - name: Check that debug and DNF records were excluded
      ansible.builtin.command:
        argv:
          - grep
          - -Ec
          - '^[0-9]+ <[0-9]+>1 [^ ]+ [^ ]+ (molecule-journal|dnf5?\.log) [^ ]+ - - (filtered-debug-probe|excluded-dnf-probe)$'
          - /var/log/molecule-collector-tls
      register: __rsyslog_excluded
      changed_when: false
      failed_when: __rsyslog_excluded.rc != 1

- name: Verify mutual TLS and an independent certificate identity
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: 127.0.0.1
    rsyslog_port: 16514
    rsyslog_permitted_peers: [standby.example.org, localhost]
    rsyslog_client_cert_file: /run/rsyslog-client.crt
    rsyslog_client_key_file: /run/rsyslog-client.key
    rsyslog_min_severity: warning
    rsyslog_queue_max_disk_space: 64m
  pre_tasks:
    - name: Create the client identity trusted by the mutual TLS collector
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=molecule-sender
          -addext extendedKeyUsage=clientAuth -keyout /run/rsyslog-client.key -out /run/rsyslog-client.crt
        creates: /run/rsyslog-client.key
      register: __rsyslog_client_cert
      changed_when: __rsyslog_client_cert.start is not none
      failed_when: __rsyslog_client_cert.rc != 0

    - name: Grant the Ubuntu service account read access to the client key
      become: true
      become_user: root
      ansible.builtin.file:
        path: /run/rsyslog-client.key
        group: syslog
        mode: '0640'
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Start a collector requiring the trusted client certificate
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-mtls.service
        state: started
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Write records either side of the severity threshold
      ansible.builtin.command: "systemd-cat -p {{ __rsyslog_priority }} -t molecule-mtls /bin/echo probe-{{ __rsyslog_priority }}"
      register: __rsyslog_priority_probe
      changed_when: __rsyslog_priority_probe.rc == 0
      failed_when: __rsyslog_priority_probe.rc != 0
      loop: [notice, warning]
      loop_control:
        loop_var: __rsyslog_priority
        label: "{{ __rsyslog_priority }}"

    - name: Wait for the warning on the authenticated connection
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-mtls
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ molecule-mtls \d+ - - probe-warning$'
        timeout: 45

    - name: Check that the less urgent notice stayed local
      ansible.builtin.command:
        argv: [grep, -Ec, '^[0-9]+ <[0-9]+>1 [^ ]+ [^ ]+ molecule-mtls [0-9]+ - - probe-notice$', /var/log/molecule-collector-mtls]
      register: __rsyslog_notice
      changed_when: false
      failed_when: __rsyslog_notice.rc != 1

- name: Buffer journal and file inputs on a pure TCP forwarder
  hosts: all
  gather_facts: true
  vars:
    rsyslog_server: 127.0.0.1
    rsyslog_transport: tcp
    rsyslog_forward_only: true
    rsyslog_platform_files: [/var/log/molecule-platform.log]
    rsyslog_additional_files:
      - /var/log/molecule-extra.log
      - path: /var/log/molecule-app.log
        tag: myapp
        facility: local3
  pre_tasks:
    - name: Take the TCP collector offline
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-tcp.service
        state: stopped
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: Write a journal record while the TCP collector is offline
      ansible.builtin.command: systemd-cat -p info -t molecule-buffer /bin/echo offline-journal-probe
      register: __rsyslog_offline_journal
      changed_when: __rsyslog_offline_journal.rc == 0
      failed_when: __rsyslog_offline_journal.rc != 0

    - name: Send a separate record directly to the distribution's syslog socket
      ansible.builtin.command:
        cmd: socat -u STDIN UNIX-SENDTO:/run/systemd/journal/syslog
        stdin: '<14>molecule-socket: offline-socket-probe'
      register: __rsyslog_offline_socket
      changed_when: __rsyslog_offline_socket.rc == 0
      failed_when: __rsyslog_offline_socket.rc != 0
      when: ansible_facts.os_family != 'RedHat'

    - name: Create selected text inputs after the daemon has restarted
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/var/log/molecule-{{ __rsyslog_source }}.log"
        content: "probe-{{ __rsyslog_source }}\n"
        mode: '0644'
      loop: [platform, extra, app]
      loop_control:
        loop_var: __rsyslog_source
        label: "{{ __rsyslog_source }}"

    - name: Stop the sender while the TCP collector is offline
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: stopped

    - name: Remove a consumed input so only the saved queue can deliver its record
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/log/molecule-extra.log
        state: absent

    - name: Bring the TCP collector back online
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: molecule-syslog-tcp.service
        state: started

    - name: Start the sender with its saved queue
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: rsyslog.service
        state: started

    - name: Wait for the buffered journal record at the TCP collector
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tcp
        search_regex: '(?m)^[0-9]+ <[0-9]+>1 \S+ \S+ molecule-buffer \d+ - - offline-journal-probe$'
        timeout: 45

    - name: Verify the journal and socket probes bypassed the distribution's local file
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - 'molecule-(buffer|socket)(\[[0-9]+\])?: offline-(journal|socket)-probe'
          - "{{ '/var/log/syslog' if ansible_facts.os_family == 'Debian' else '/var/log/messages' }}"
      register: __rsyslog_local_probes
      changed_when: false
      failed_when: __rsyslog_local_probes.rc != 1

    - name: Verify octet-counted TCP records with default and custom file metadata
      ansible.builtin.wait_for:
        path: /var/log/molecule-collector-tcp
        search_regex: '(?m)^[0-9]+ <{{ __rsyslog_probe.pri }}>1 \S+ \S+ {{ __rsyslog_probe.tag }} - - - probe-{{ __rsyslog_probe.source }}$'
        timeout: 45
      loop:
        - { source: platform, tag: 'molecule-platform\.log', pri: 134 }
        - { source: extra, tag: 'molecule-extra\.log', pri: 134 }
        - { source: app, tag: myapp, pri: 158 }
      loop_control:
        loop_var: __rsyslog_probe
        label: "{{ __rsyslog_probe.source }}"
