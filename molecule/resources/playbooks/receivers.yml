---
# role: rsyslog
# file: molecule/resources/playbooks/receivers.yml

- name: Prepare the GitHub-hosted runner for guest daemons
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Rootless containers inherit the runner's executable attachment for /usr/sbin/rsyslogd.
    - name: Unload the runner's rsyslog profile before starting guest services
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: apparmor_parser --remove /etc/apparmor.d/usr.sbin.rsyslogd
        removes: /sys/kernel/security/apparmor/policy/profiles/rsyslogd.*
      register: __rsyslog_profile_removal
      changed_when: __rsyslog_profile_removal.start is not none
      failed_when: __rsyslog_profile_removal.rc != 0
      when: lookup('ansible.builtin.env', 'RUNNER_ENVIRONMENT') == 'github-hosted'

- name: Refresh package metadata
  ansible.builtin.import_playbook: prepare.yml

- name: Prepare loopback collectors
  hosts: all
  gather_facts: true
  vars:
    __rsyslog_anchor_dirs:
      Debian: /usr/local/share/ca-certificates
      RedHat: /etc/pki/ca-trust/source/anchors
      Suse: /etc/pki/trust/anchors
  tasks:
    - name: Write historical log files before the sender is installed
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/var/log/molecule-time-{{ __rsyslog_fixture.name }}"
        content: "{{ __rsyslog_fixture.lines }}\n"
        mode: '0644'
      loop:
        - name: access
          lines: '192.0.2.4 - - [26/Nov/2020:17:03:35 +0100] "GET /old HTTP/1.1" 200 15'
        - name: apache
          lines: '[Thu Nov 26 15:22:56.738453 2020] [core:error] archived apache'
        - name: nginx
          lines: |-
            2020/07/15 16:59:41 archived summer
            2020/11/26 16:59:41 archived winter
            2020/10/25 02:30:00 archived overlap
            2020/03/29 02:30:00 archived gap
            2020/02/31 10:01:00 archived invalid date
        - name: json
          lines: |-
            {"other":"2030-01-01T00:00:00Z","@timestamp":"2020-04-05T01:02:03.123456789-0400","msg":"archived json"}
            {"other":"2020-01-01T00:00:00Z","msg":"missing field"}
        - name: sssd
          lines: 'worker (2020-11-26 10:00:00:123456) archived sssd'
        - name: plain
          lines: '2020-11-26T12:00:00Z archived plain'
      loop_control:
        loop_var: __rsyslog_fixture
        label: "{{ __rsyslog_fixture.name }}"

    - name: Resolve the test receiver to its IPv4 loopback listener
      become: true
      become_user: root
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: '127.0.0.1 rsyslog-collector.test'
        unsafe_writes: true  # Podman bind-mounts /etc/hosts.

    - name: Install collector tools
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - socat
          - openssl
          - ca-certificates
          - "{{ 'iproute' if ansible_facts.os_family == 'RedHat' else 'iproute2' }}"
        state: present

    - name: Create a certificate for the TLS collector
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost
          -addext subjectAltName=DNS:localhost,DNS:rsyslog-collector.test -keyout /run/rsyslog-collector.key
          -out /run/rsyslog-collector.crt
        creates: /run/rsyslog-collector.key
      register: __rsyslog_collector_cert
      changed_when: __rsyslog_collector_cert.start is not none
      failed_when: __rsyslog_collector_cert.rc != 0

    - name: Trust the test collector through the platform CA store
      become: true
      become_user: root
      ansible.builtin.copy:
        src: /run/rsyslog-collector.crt
        remote_src: true
        dest: "{{ __rsyslog_anchor_dirs[ansible_facts.os_family] }}/molecule-collector.crt"
        mode: '0644'
      notify: Refresh the platform CA bundle

    - name: Install the loopback collector units
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/run/systemd/system/molecule-syslog-{{ __rsyslog_collector.name }}.service"
        mode: '0644'
        content: |
          [Service]
          WorkingDirectory=/run
          ExecStart=/usr/bin/socat -u {{ __rsyslog_collector.listener }} OPEN:/var/log/molecule-collector-{{ __rsyslog_collector.name }},creat,append
      loop:
        - name: tcp
          listener: TCP4-LISTEN:514,bind=127.0.0.1,reuseaddr,fork
        - name: tls
          listener: OPENSSL-LISTEN:6514,bind=127.0.0.1,reuseaddr,fork,verify=0,cert=rsyslog-collector.crt,key=rsyslog-collector.key
        - name: mtls
          listener: >-
            OPENSSL-LISTEN:16514,bind=127.0.0.1,reuseaddr,fork,verify=1,cafile=rsyslog-client.crt,cert=rsyslog-collector.crt,key=rsyslog-collector.key
      loop_control:
        loop_var: __rsyslog_collector
        label: "{{ __rsyslog_collector.name }}"

    - name: Start the TCP and TLS collectors
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "molecule-syslog-{{ __rsyslog_transport }}.service"
        daemon_reload: true
        state: started
      loop: [tcp, tls]
      loop_control:
        loop_var: __rsyslog_transport
        label: "{{ __rsyslog_transport }}"

  handlers:
    - name: Refresh the platform CA bundle
      become: true
      become_user: root
      ansible.builtin.command: "{{ 'update-ca-trust' if ansible_facts.os_family == 'RedHat' else 'update-ca-certificates' }}"
      register: __rsyslog_trust_update
      changed_when: __rsyslog_trust_update.rc == 0
      failed_when: __rsyslog_trust_update.rc != 0
